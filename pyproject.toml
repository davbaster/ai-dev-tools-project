[project]
name = "para-luego"
version = "0.1.0"
description = "Para Luego: save links, videos, books and products for later."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi",
    "httpx",
    "jinja2",
    "psycopg[binary]>=3.3.8",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pytest",
    "pyyaml",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
