# Prometheus (#14): scrapes the collector's prometheus exporter. honor_labels
# keeps job = the service name (para-luego-frontend / para-luego-backend).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
