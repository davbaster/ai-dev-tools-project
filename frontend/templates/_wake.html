{# El backend gratis de Render solo despierta con tráfico de internet (#11): el
   navegador llama a su /api/health y, cuando contesta, la página se recarga con
   GET. Sin datos del usuario: solo la URL pública del backend (configuración). #}
<p class="meta" id="wake-status" role="status">Despertando el servicio, puede tardar hasta un minuto…</p>
<script data-health-url="{{ wake_url }}/api/health">
  (() => {
    const healthUrl = document.currentScript.dataset.healthUrl;
    const status = document.getElementById("wake-status");
    const KEY = "pl-wake-started";
    const LIMIT_MS = 3 * 60 * 1000;
    let started = Date.now();
    try {
      const saved = Number(sessionStorage.getItem(KEY));
      if (saved && Date.now() - saved < 5 * 60 * 1000) started = saved;
      sessionStorage.setItem(KEY, String(started));
    } catch {}
    const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    (async () => {
      while (Date.now() - started < LIMIT_MS) {
        try {
          // no-cors: no hace falta leer la respuesta, solo que llegue.
          await fetch(healthUrl, { mode: "no-cors", cache: "no-store" });
          await pause(5000);
          location.replace(location.href);
          return;
        } catch {
          await pause(3000);
        }
      }
      try { sessionStorage.removeItem(KEY); } catch {}
      status.textContent = "No se pudo despertar el servicio. Probá recargar en un rato.";
    })();
  })();
</script>
