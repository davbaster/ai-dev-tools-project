<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Para Luego{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    form { display: grid; gap: .75rem; }
    label { display: grid; gap: .25rem; }
    input, button { font: inherit; padding: .5rem; }
    .errors { color: #b00020; }
    .meta { color: #666; font-size: .85rem; margin-top: 2rem; }
    ul.categories { list-style: none; padding: 0; }
    ul.categories li { display: flex; gap: .5rem; align-items: center; padding: .25rem 0; }
    form.inline { display: inline; }
    input, select, textarea { font: inherit; padding: .5rem; }
    ul.items { list-style: none; padding: 0; }
    ul.items li { border-bottom: 1px solid #eee; padding: .5rem 0; }
    .category { color: #555; font-size: .85rem; margin-left: .5rem; }
    .note { margin: .25rem 0; color: #333; }
    nav.filter { margin: 1rem 0; }
    .share { display: inline-flex; gap: .5rem; align-items: center; margin: .25rem .5rem .25rem 0; }
    .share a.button { padding: .5rem; border: 1px solid #767676; border-radius: 2px; color: inherit; text-decoration: none; }
    .copied { color: #1b5e20; font-size: .85rem; }
  </style>
</head>
<body>
  <h1>Para Luego</h1>
  {% block content %}{% endblock %}
  <script>
    // Botón Copiar: el texto viene escapado en data-copy, nunca dentro del script.
    document.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-copy]");
      if (!button) return;
      const status = button.parentElement.querySelector(".copied");
      try {
        await navigator.clipboard.writeText(button.dataset.copy);
        status.textContent = "Copiado";
      } catch {
        status.textContent = "No se pudo copiar";
      }
      clearTimeout(button.copyTimer);
      button.copyTimer = setTimeout(() => { status.textContent = ""; }, 2000);
    });
  </script>
</body>
</html>
