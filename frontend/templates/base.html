<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Para Luego{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    form { display: grid; gap: .75rem; }
    label { display: grid; gap: .25rem; }
    input, button { font: inherit; padding: .5rem; }
    .errors { color: #b00020; }
    .meta { color: #666; font-size: .85rem; margin-top: 2rem; }
    ul.categories { list-style: none; padding: 0; }
    ul.categories li { display: flex; gap: .5rem; align-items: center; padding: .25rem 0; }
    form.inline { display: inline; }
  </style>
</head>
<body>
  <h1>Para Luego</h1>
  {% block content %}{% endblock %}
</body>
</html>
