# Contrato entre frontend y backend (contract-first).
# Para agregar o cambiar un endpoint: editar este archivo primero, luego el backend
# y el cliente del frontend, en el mismo cambio. Los tests de tests/contract/ lo verifican.
openapi: 3.1.0
info:
  title: Para Luego API
  version: 0.4.0
  description: JSON API served by the backend and called by the frontend.
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Backend health check. Touches no database.
      responses:
        "200":
          description: The backend is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/auth/register:
    post:
      operationId: register
      summary: Create a user. The username is trimmed and lowercased.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: The username is taken (in any letter case).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid username or password. Never echoes the input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /api/auth/login:
    post:
      operationId: login
      summary: Exchange credentials for a token (valid 7 days).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Wrong username or password (same answer for both).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Malformed request. Never echoes the input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke the token used in the request.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out; the token no longer works.
        "401":
          description: Missing, unknown or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/me:
    get:
      operationId: getMe
      summary: The user the token belongs to.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing, unknown or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/categories:
    get:
      operationId: listCategories
      summary: The caller's categories, defaults first, then in creation order.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          description: Missing, unknown or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createCategory
      summary: Create a category. The name is trimmed; unique per user ignoring case.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      responses:
        "201":
          description: Category created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          description: Missing, unknown or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The caller already has a category with that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /api/categories/{category_id}:
    delete:
      operationId: deleteCategory
      summary: Delete one of the caller's categories. It must have no items.
      security:
        - bearerAuth: []
      parameters:
        - name: category_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted.
        "401":
          description: Missing, unknown or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such category for this user (also for other users' ids).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The category still has items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/items:
    get:
      operationId: listItems
      summary: The caller's items, newest first, optionally of one category.
      security:
        - bearerAuth: []
      parameters:
        - name: category_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: The items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
        "401":
          description: Missing, unknown or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The category doesn't exist or isn't the caller's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createItem
      summary: Save an item. The key user journey.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemCreate"
      responses:
        "201":
          description: Item saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "401":
          description: Missing, unknown or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            Invalid url, title or note, or a category that isn't the caller's
            (field `category_id`, same answer for missing and foreign ids).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /api/items/{item_id}:
    delete:
      operationId: deleteItem
      summary: Delete one of the caller's items.
      security:
        - bearerAuth: []
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted.
        "401":
          description: Missing, unknown or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such item for this user (also for other users' ids).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque token from `login`.

  schemas:
    Health:
      type: object
      required: [status, deployment]
      properties:
        status:
          type: string
          enum: [ok]
        deployment:
          type: string
          enum: [local, dev, prod]

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: 3-50 characters after trimming; letters, digits, ".", "_", "-".
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 8
          maxLength: 128

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, username, is_admin]
      properties:
        id:
          type: integer
        username:
          type: string
        is_admin:
          type: boolean

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    Item:
      type: object
      required: [id, url, title, note, category_id, category_name, created_at]
      properties:
        id:
          type: integer
        url:
          type: string
        title:
          type: string
        note:
          type: [string, "null"]
        category_id:
          type: integer
        category_name:
          type: string
        created_at:
          type: string
          format: date-time

    ItemCreate:
      type: object
      required: [url, category_id]
      properties:
        url:
          type: string
          description: Trimmed; must start with http:// or https://.
          maxLength: 2048
        title:
          type: [string, "null"]
          description: Trimmed; empty or missing means the URL is used.
          maxLength: 300
        category_id:
          type: integer
        note:
          type: [string, "null"]
          description: Empty is stored as null.
          maxLength: 1000

    Category:
      type: object
      required: [id, name, item_count]
      properties:
        id:
          type: integer
        name:
          type: string
        item_count:
          type: integer

    CategoryCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 1-50 characters after trimming.
          minLength: 1
          maxLength: 50

    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    ValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
